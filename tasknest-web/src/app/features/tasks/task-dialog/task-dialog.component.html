<div class="dialog-wrapper">

  <div class="dialog-header">
    <div class="dialog-title-group">
      <mat-icon class="dialog-title-icon">{{ data?.task ? 'edit_note' : 'add_task' }}</mat-icon>
      <h2 class="dialog-title">{{ data?.task ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>
    </div>
    <button mat-icon-button class="close-btn" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="dialog-divider"></div>

  <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="dialog-form">

    <div class="field-group">
      <label class="field-label">¿Qué tienes que hacer?</label>
      <mat-form-field appearance="outline" class="field-mat">
        <input matInput formControlName="title" placeholder="Ej: Terminar informe mensual">
      </mat-form-field>
    </div>

    <div class="field-group">
      <label class="field-label">Detalles adicionales</label>
      <mat-form-field appearance="outline" class="field-mat">
        <textarea matInput formControlName="description" rows="3"
                  placeholder="Añade notas o pasos específicos..."></textarea>
      </mat-form-field>
    </div>

    <div class="field-group">
      <label class="field-label">Etiquetas</label>
      <mat-form-field appearance="outline" class="field-mat">
        <mat-chip-grid #chipGrid aria-label="Selecciona etiquetas">
          <mat-chip-row *ngFor="let tag of tags" (removed)="removeTag(tag)">
            {{ tag }}
            <button matChipRemove [attr.aria-label]="'Borrar ' + tag">
              <mat-icon>cancel</mat-icon>
            </button>
          </mat-chip-row>
          <input placeholder="Escribe y pulsa Enter..."
                 [matChipInputFor]="chipGrid"
                 [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                 [matChipInputAddOnBlur]="true"
                 (matChipInputTokenEnd)="addTag($event)"
                 (keydown.enter)="$event.preventDefault()"/>
        </mat-chip-grid>
      </mat-form-field>
    </div>

    <div class="two-cols">
      <div class="field-group">
        <label class="field-label">Fecha Límite</label>
        <mat-form-field appearance="outline" class="field-mat">
          <mat-icon matPrefix class="prefix-icon">calendar_today</mat-icon>
          <input matInput type="date" formControlName="dueDate">
        </mat-form-field>
      </div>

      <div class="field-group">
        <label class="field-label">Prioridad</label>
        <mat-form-field appearance="outline" class="field-mat">
          <mat-icon matPrefix class="prefix-icon">flag</mat-icon>
          <mat-select formControlName="priority">
            <mat-option value="LOW">
              <span class="priority-option low">● Baja</span>
            </mat-option>
            <mat-option value="MEDIUM">
              <span class="priority-option medium">● Media</span>
            </mat-option>
            <mat-option value="HIGH">
              <span class="priority-option high">● Alta</span>
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <div class="dialog-divider"></div>

    <div class="dialog-actions">
      <button mat-stroked-button type="button" (click)="onCancel()" class="cancel-btn">
        Cancelar
      </button>
      <button mat-flat-button color="primary" type="submit"
              [disabled]="taskForm.invalid" class="submit-btn">
        <mat-icon>{{ data?.task ? 'save' : 'add_task' }}</mat-icon>
        {{ data?.task ? 'Guardar Cambios' : 'Crear Tarea' }}
      </button>
    </div>

  </form>
</div>
