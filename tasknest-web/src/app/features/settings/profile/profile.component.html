<div class="settings-page">

  <div class="settings-header">
    <h1 class="settings-title">Ajustes de Cuenta</h1>
    <p class="settings-subtitle">Gestiona tu información personal y seguridad</p>
  </div>

  <div class="settings-card">

    <!-- Perfil -->
    <div class="profile-section">
      <div class="profile-avatar">
        {{ userInitials }}
      </div>
      <div class="profile-info">
        <p class="profile-name">{{ usernameDisplay }}</p>
        <span class="profile-badge">
          <span class="badge-dot"></span>
          Usuario Activo
        </span>
      </div>
    </div>

    <div class="card-divider"></div>

    <!-- Formulario -->
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="settings-form">

      <div class="section-heading">
        <mat-icon class="section-icon">lock</mat-icon>
        <h3 class="section-title">Cambiar Contraseña</h3>
      </div>

      <div class="form-row full-width">
        <div class="field-group">
          <label class="field-label">Contraseña Actual</label>
          <input type="password" formControlName="currentPassword"
                 class="field-input"
                 placeholder="••••••••">
        </div>
      </div>

      <div class="form-row two-cols">
        <div class="field-group">
          <label class="field-label">Nueva Contraseña</label>
          <input type="password" formControlName="newPassword"
                 class="field-input"
                 placeholder="••••••••">
          <p *ngIf="passwordForm.get('newPassword')?.hasError('minlength') && passwordForm.get('newPassword')?.touched"
             class="field-error">
            <mat-icon class="error-icon">info</mat-icon>
            Mínimo 6 caracteres.
          </p>
        </div>

        <div class="field-group">
          <label class="field-label">Confirmar Contraseña</label>
          <input type="password" formControlName="confirmPassword"
                 class="field-input"
                 placeholder="••••••••">
          <p *ngIf="passwordForm.hasError('passwordsMismatch') && passwordForm.get('confirmPassword')?.touched"
             class="field-error">
            <mat-icon class="error-icon">info</mat-icon>
            Las contraseñas no coinciden.
          </p>
        </div>
      </div>

      <div class="form-actions">
        <button mat-flat-button color="primary" type="submit"
                [disabled]="passwordForm.invalid || isLoading"
                class="save-btn">
          <mat-spinner *ngIf="isLoading" diameter="18" class="btn-spinner"></mat-spinner>
          <mat-icon *ngIf="!isLoading">save</mat-icon>
          Guardar Cambios
        </button>
      </div>

    </form>
  </div>
</div>
